name: Verkor
description: 'Verkor is a French cleantech manufacturer founded in 2020 to fast-track low-carbon
  lithium-ion battery production in Europe. Operating a "digital by design" industrial model, Verkor
  produces high-performance battery cells and modules for electric mobility and stationary energy
  storage, scaling through its Dunkerque Gigafactory toward 16 GWh of annual cell capacity to serve the
  European market. Verkor is a physical-products/industrial company and does not publish a public
  developer API, SDK, or API documentation; this profile captures its identity and public web surface
  within the API Evangelist network. Backed by EQT Ventures.'
